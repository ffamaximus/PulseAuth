name: Release

# Publishes PulseAuth, PulseAuth.EntityFramework and PulseAuth.Identity to nuget.org when a
# version tag is pushed:
#
#   git tag v1.4.0
#   git push origin v1.4.0
#
# Authentication with nuget.org: the NUGET_API_KEY secret if present, otherwise nuget.org Trusted
# Publishing (GitHub OIDC → short-lived key, no stored secret). See the `publish` job.

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-pack:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Tag must match <Version> in Directory.Build.props
        run: |
          PROPS_VERSION=$(grep -oPm1 '(?<=<Version>)[0-9][^<]*(?=</Version>)' Directory.Build.props)
          if [ "$PROPS_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag v${{ steps.version.outputs.version }} does not match <Version>$PROPS_VERSION</Version> in Directory.Build.props"
            exit 1
          fi

      - name: CHANGELOG must have a section for this version
        run: |
          grep -q "^## ${{ steps.version.outputs.version }}\b" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section"; exit 1; }

      - name: Setup .NET (8, 9, 10)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore PulseAuth.sln

      - name: Build
        run: dotnet build PulseAuth.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test PulseAuth.sln --configuration Release --no-build --logger trx

      - name: Vulnerable package check
        run: |
          dotnet list PulseAuth.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"; exit 1
          fi

      - name: Pack (with symbols)
        run: >
          dotnet pack PulseAuth.sln --configuration Release --no-build --output ./artifacts
          -p:ContinuousIntegrationBuild=true
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Check the three packages were produced
        run: |
          ls -l ./artifacts
          for p in PulseAuth PulseAuth.EntityFramework PulseAuth.Identity; do
            test -f "./artifacts/$p.${{ steps.version.outputs.version }}.nupkg" \
              || { echo "::error::Missing $p.${{ steps.version.outputs.version }}.nupkg"; exit 1; }
          done

      - uses: actions/upload-artifact@v5
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  publish:
    needs: build-test-pack
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
    # Optional: add required reviewers to this environment (Settings → Environments → nuget)
    # to approve every release manually before it reaches nuget.org.
    environment: nuget
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # only needed for nuget.org Trusted Publishing (OIDC)
    env:
      # Two ways to authenticate with nuget.org — whichever is configured is used:
      #  1. secret NUGET_API_KEY  → classic API key (nuget.org → API Keys, scope "Push").
      #  2. secret NUGET_USER     → Trusted Publishing: no stored key; requires a policy on
      #                             nuget.org (owner ffamaximus, repo PulseAuth,
      #                             workflow release.yml, environment nuget).
      # Secrets cannot be used in `if:` conditions, so they are exposed as env vars here.
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
      - name: Check nuget.org credentials are configured
        run: |
          if [ -z "$NUGET_API_KEY" ] && [ -z "$NUGET_USER" ]; then
            echo "::error::Configure the secret NUGET_API_KEY (API key) or NUGET_USER (Trusted Publishing) in the 'nuget' environment or the repository."
            exit 1
          fi
          if [ -n "$NUGET_API_KEY" ]; then echo "Using the NUGET_API_KEY secret"; else echo "Using Trusted Publishing as $NUGET_USER"; fi

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (Trusted Publishing, OIDC → temporary API key)
        id: login
        if: env.NUGET_API_KEY == ''
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}   # nuget.org profile name (not the e-mail)

      - name: Push to nuget.org
        # .snupkg symbol packages next to each .nupkg are pushed automatically.
        env:
          PUSH_KEY: ${{ env.NUGET_API_KEY != '' && env.NUGET_API_KEY || steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "$PUSH_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release with the CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-test-pack.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists (re-run): uploading packages only"
            gh release upload "v$VERSION" ./artifacts/*.nupkg --clobber
            exit 0
          fi
          # Section of CHANGELOG.md between "## <version>" and the next "## " heading
          awk -v v="$VERSION" '
            $0 ~ "^## " v "([^0-9.]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v$VERSION" ./artifacts/*.nupkg \
            --title "PulseAuth $VERSION" --notes-file release-notes.md $PRERELEASE
